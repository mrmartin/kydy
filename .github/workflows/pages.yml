name: Publikovat kydy.cz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ověřit metodiku a přiřazení důkazů
        run: python3 -m unittest discover -s tests -v
      - name: Sestavit srovnání ze zdrojovaných dat
        run: python3 scripts/build_assessment.py
      - name: Ověřit web
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
